services:
  mysql:
    image: mysql:9.6
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sqllab
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - labcode_mysql_data_fresh:/var/lib/mysql

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: sqllab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  valkey:
    image: valkey/valkey:8.1.11
    container_name: valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

volumes:
  labcode_mysql_data_fresh:
  mysql_data:
  postgres_data:
  mongo_data:
  valkey_data:
